version: '3.8'

# ==============================================================================
# WeLovePDF Local Development Docker Compose Configuration
# ==============================================================================

services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: welovepdf-app-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - welovepdf-dev-net

networks:
  welovepdf-dev-net:
    driver: bridge
