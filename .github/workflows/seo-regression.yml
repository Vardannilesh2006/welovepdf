name: SEO & SSR Regression Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  seo-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Start Next.js production server
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run SEO & SSR Regression Audit Script
        env:
          BASE_URL: http://localhost:3000
        run: node scripts/seo-ssr-regression-check.mjs
